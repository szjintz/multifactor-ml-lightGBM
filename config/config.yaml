data:
  market: csi300
  start_date: 2018-01-01
  end_date: 2025-06-30

factors:
  use_qlib: true
  custom_factors: true
  preprocessing:
    winsorize: 3sigma
    standardize: cross_sectional
    neutralize: [market_cap, industry, beta]
    orthogonalize: gram_schmidt

training:
  window_months: 24
  predict_days: 20
  rolling_step: monthly
  objective: lambdarank
  early_stopping_rounds: 30
  optuna_trials: 50
  lgb_params:
    num_leaves: 31
    min_child_samples: 20
    learning_rate: 0.05
    reg_alpha: 0.1
    reg_lambda: 0.1
    bagging_fraction: 0.8
    feature_fraction: 0.8
    min_gain_to_split: 0.0

portfolio:
  top_n: 50
  turnover_limit: 0.30
  risk_aversion: 1.0
  max_weight: 0.05
  sector_neutral: true
  size_neutral: true

monte_carlo:
  noise_levels: [0.001, 0.005, 0.01, 0.02, 0.05]
  n_simulations: 200
  seed: 42

backtest:
  benchmark: csi300
  slippage: 0.003
  market_impact: 0.001
