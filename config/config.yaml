# ============================================================
# 多因子策略配置文件
#
# 配置结构：
# - data: 数据源和日期范围
# - factors: 因子计算和预处理配置
# - training: 模型训练参数
# - portfolio: 组合优化参数
# - monte_carlo: 蒙特卡洛模拟参数
# - fundamental: 基本面数据参数
# - backtest: 回测参数
# ============================================================

data:
  market: csi300                        # 股票池：csi300（沪深300）/ csi500（中证500）/ csi800（中证800）
  start_date: 2022-01-01                # 数据开始日期
  end_date: 2026-06-30                  # 数据结束日期

factors:
  use_qlib: true                        # 是否使用 Qlib 获取数据
  custom_factors: true                  # 是否使用自定义因子
  preprocessing:
    winsorize: 3sigma                   # 异常值处理方法：3sigma 或 quantile
    standardize: cross_sectional        # 标准化方法：cross_sectional（截面标准化）
    neutralize: [market_cap, industry]  # 中性化变量：市值 + 申万一级行业
    orthogonalize: none                 # 正交化方法：gram_schmidt, pca, 或 none（保留因子可解释性）

training:
  window_months: 24                     # 训练窗口大小（月数）- 更多数据提升模型稳定性
  predict_days: 20                      # 预测持有期天数
  rolling_step: monthly                 # 滚动步长：monthly
  objective: regression                 # 目标函数：regression（截面 Z-score 标签）
  early_stopping_rounds: 50             # 早停轮数（patience=50）
  num_boost_round: 1000                 # 固定迭代次数上限（增加以允许更复杂的树）
  optuna_trials: 20                     # Optuna 超参搜索次数（仅在第一个 fold 执行）
  lgb_params:                           # LightGBM 基础参数（始终覆盖 Optuna 调优结果）
    num_leaves: 31                      # 单棵树最大叶子数
    min_child_samples: 20               # 叶子最小样本数
    learning_rate: 0.02                 # 学习率
    reg_alpha: 0.1                      # L1 正则化
    reg_lambda: 0.1                     # L2 正则化
    bagging_fraction: 0.8               # 行采样比例
    feature_fraction: 0.8               # 列采样比例
    min_gain_to_split: 0.001            # 分裂最小增益阈值（允许树分裂但限制噪声分裂）

portfolio:
  weight_method: mean_variance          # 均值-方差优化（引入协方差风险控制，压制波动）
  top_n: 60                             # 持仓增至60只，增强分散化降低波动
  turnover_limit: 0.30                  # 收紧换手率，降低交易成本
  risk_aversion: 2.0                    # 适中风险厌恶（降低以释放alpha，同时 ridge 保证稳定性）
  max_weight: 0.05                      # 单股权重减半，强制分散
  cov_ridge: 0.01                       # 协方差 ridge 正则化强度（保证正定，ECOS 可解）
  sector_neutral: false                 # 是否行业中性（暂不支持行业数据）
  size_neutral: false                   # 是否市值中性（先关闭以验证基础流程）

monte_carlo:
  noise_levels: [0.001, 0.005, 0.01, 0.02, 0.05]  # 噪声水平列表（相对于因子标准差）
  n_simulations: 200                    # 每种噪声水平的模拟次数
  seed: 42                              # 随机种子

fundamental:
  cache_dir: /home/jinqh/lightGBM_qlib/data/qlib_fundamental_cache  # 基本面数据缓存目录
  use_akshare: true                       # 使用 Akshare 获取基本面数据（已有完整缓存，后续运行快）

backtest:
  benchmark: csi300                     # 基准指数
  slippage: 0.003                       # 交易成本和滑点（双边）
  market_impact: 0.001                  # 市场冲击成本