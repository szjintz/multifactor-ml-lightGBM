# ============================================================
# 多因子策略配置文件
#
# 配置结构：
# - data: 数据源和日期范围
# - factors: 因子计算和预处理配置
# - training: 模型训练参数
# - portfolio: 组合优化参数
# - monte_carlo: 蒙特卡洛模拟参数
# - fundamental: 基本面数据参数
# - backtest: 回测参数
# ============================================================

data:
  market: csi300                        # 股票池：csi300（沪深300）/ csi500（中证500）/ csi800（中证800）
  start_date: 2022-01-01                # 数据开始日期
  end_date: 2026-06-30                  # 数据结束日期

factors:
  use_qlib: true                        # 是否使用 Qlib 获取数据
  custom_factors: true                  # 是否使用自定义因子
  preprocessing:
    winsorize: 3sigma                   # 异常值处理方法：3sigma 或 quantile
    standardize: cross_sectional        # 标准化方法：cross_sectional（截面标准化）
    neutralize: [market_cap]            # 中性化变量：市值（行业数据暂不可用）
    orthogonalize: pca                  # 正交化方法：gram_schmidt, pca, 或 none

training:
  window_months: 24                     # 训练窗口大小（月数）
  predict_days: 20                      # 预测持有期天数（需与标签 periods 一致）
  rolling_step: monthly                 # 滚动步长：monthly
  objective: lambdarank                 # 目标函数：lambdarank（LTR排序）
  early_stopping_rounds: 30             # 早停轮数
  optuna_trials: 10                     # 内存优化：减少超参搜索次数（从50减少到10）
  lgb_params:                           # LightGBM 基础参数
    num_leaves: 31                      # 单棵树最大叶子数
    min_child_samples: 20               # 叶子最小样本数
    learning_rate: 0.05                 # 学习率
    reg_alpha: 0.1                      # L1 正则化
    reg_lambda: 0.1                     # L2 正则化
    bagging_fraction: 0.8               # 行采样比例
    feature_fraction: 0.8               # 列采样比例
    min_gain_to_split: 0.0              # 分裂最小增益阈值

portfolio:
  top_n: 20                             # 持仓股票数量
  turnover_limit: 0.10                  # 最大换手率（单边）
  risk_aversion: 5.0                    # 风险厌恶系数
  max_weight: 0.08                      # 单股最大权重
  sector_neutral: true                  # 是否行业中性
  size_neutral: true                    # 是否市值中性

monte_carlo:
  noise_levels: [0.001, 0.005, 0.01, 0.02, 0.05]  # 噪声水平列表（相对于因子标准差）
  n_simulations: 200                    # 每种噪声水平的模拟次数
  seed: 42                              # 随机种子

fundamental:
  cache_dir: /tmp/qlib_fundamental_cache  # 基本面数据缓存目录
  use_akshare: true                     # 是否使用 Akshare 获取基本面数据

backtest:
  benchmark: csi300                     # 基准指数
  slippage: 0.003                       # 交易成本和滑点（双边）
  market_impact: 0.001                  # 市场冲击成本